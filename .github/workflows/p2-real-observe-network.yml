name: P2 Real Observe Network

on:
  pull_request:
    paths:
      - "patches/p2/**"
      - "tools/p2/netns/**"
      - ".github/workflows/p2-real-observe-network.yml"
      - "阶段任务书/P2-真实Observe网络验证.md"
  workflow_dispatch:

jobs:
  real-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout with frozen host submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Install native and network dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake clang pkg-config perl nasm \
            iproute2 iputils-ping iperf3 time

      - name: Apply frozen-host Observe patches
        run: bash tools/p2/apply-host-patches.sh

      - name: Build real tokio-quiche sender
        run: |
          cargo build \
            --manifest-path third_party/quiche-0.29.3/Cargo.toml \
            -p tokio-quiche \
            --example async_http3_server \
            --features gcongestion

      - name: Build real quiche receiver
        run: |
          cargo build \
            --manifest-path third_party/quiche-0.29.3/Cargo.toml \
            -p quiche_apps \
            --bin quiche-client

      - name: Run real Off Observe long-flow pair
        env:
          BABR_RATE_MBIT: "100"
          BABR_ONE_WAY_DELAY_MS: "20"
          BABR_LOSS_PCT: "0"
          BABR_P2_FLOW_BYTES: "67108864"
          BABR_P2_OBSERVE_ARTIFACT_DIR: ${{ github.workspace }}/阶段任务书/p2-observe-network-artifacts
        run: |
          sudo -E bash tools/p2/netns/run-observe-pair.sh

      - name: Show pair summary
        if: always()
        run: |
          if [[ -f 阶段任务书/p2-observe-network-artifacts/pair-summary.json ]]; then
            cat 阶段任务书/p2-observe-network-artifacts/pair-summary.json
          fi

      - name: Upload real Observe network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-real-observe-network-${{ github.sha }}
          path: 阶段任务书/p2-observe-network-artifacts
          if-no-files-found: error
