name: P1 Final Gate

on:
  pull_request:
    paths:
      - "阶段任务书/verify_p1.sh"
      - "阶段任务书/P1-**"
      - "阶段任务书/00-阶段总览与执行约定.md"
      - "third_party/quiche-0.29.3"
      - ".gitmodules"
      - ".github/workflows/p1-gate.yml"
  workflow_dispatch:

jobs:
  p1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config perl nasm

      - name: Run P1 Final Closure verification
        run: bash "阶段任务书/verify_p1.sh"

      - name: Upload P1 Final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-final-evidence-${{ github.sha }}
          path: 阶段任务书/p1-artifacts
          if-no-files-found: warn
