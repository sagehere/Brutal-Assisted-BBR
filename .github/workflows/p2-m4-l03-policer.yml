name: P2 M4 L03 Policer Evidence

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "patches/p2/**"
      - "tools/p2/netns/**"
      - "tools/p2/preflight.sh"
      - "tools/p2/apply-host-patches.sh"
      - "third_party/quiche-0.29.3"
      - ".github/workflows/p2-m4-l03-policer.yml"
  workflow_dispatch:

jobs:
  l03:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout frozen host
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config perl nasm iproute2 iputils-ping iperf3 time

      - name: Apply P2 patches
        run: |
          bash tools/p2/preflight.sh
          bash tools/p2/apply-host-patches.sh

      - name: Verify fail-closed P2 evidence checkers
        run: python3 -m unittest tools/p2/replay/test_check_lite_trace.py tools/p2/replay/test_verify_g2_evidence.py

      - name: Build quiche applications
        run: |
          cargo build --manifest-path third_party/quiche-0.29.3/Cargo.toml -p tokio-quiche --example async_http3_server --features gcongestion
          cargo build --manifest-path third_party/quiche-0.29.3/Cargo.toml -p quiche_apps --bin quiche-client

      - name: Collect L03 policer evidence
        env:
          # Target is byte/s inside BABR. 25,000,000 byte/s ~= 200 Mbps.
          BABR_P2_TARGET_BPS: "25000000"
          # Policer is explicit mbit/s for tc. 150 Mbps bottleneck.
          BABR_P2_POLICER_MBIT: "150"
          # The runner starts at 150 Mbps and only arms the dropping policer
          # after a real Assist admission. If safety gates prevent admission,
          # it records BLOCKED; G2 rejects that status.
          # Exploratory stimulus calibration only: 16 concurrent 64 MiB
          # streams retain the same one-GiB total while increasing the number
          # of active response producers after v2 remained APP_LIMITED.
          BABR_P2_FLOW_BYTES: "67108864"
          BABR_P2_L03_REQUESTS: "16"
          # Versioned low-queue calibration: preserve the 150 Mbps bottleneck
          # while avoiding a TBF buffer large enough to trip the 20 ms hard
          # queue guard before admission can be exercised.
          BABR_P2_L03_TBF_BURST_KB: "64"
          BABR_P2_L03_TBF_LATENCY_MS: "5"
          BABR_P2_L03_EXPERIMENT_VERSION: "l03-policer-v4-qdisc-diagnostic"
          BABR_P2_L03_RUNS: "1"
          BABR_P2_L03_ARTIFACT_ROOT: ${{ github.workspace }}/阶段任务书/p2-l03-artifacts
        run: |
          set -euo pipefail
          for run in $(seq -w 1 "$BABR_P2_L03_RUNS"); do
            echo "L03 independent run $run/$BABR_P2_L03_RUNS"
            BABR_P2_L03_ARTIFACT_DIR="$BABR_P2_L03_ARTIFACT_ROOT/run-$run" \
              sudo -E bash tools/p2/netns/run-lite-l03-policer.sh
          done

      - name: Upload L03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-l03-${{ github.sha }}
          path: 阶段任务书/p2-l03-artifacts
          if-no-files-found: error
