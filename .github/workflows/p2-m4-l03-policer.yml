name: P2 M4 L03 Policer Safety

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "patches/p2/**"
      - "tools/p2/netns/**"
      - "tools/p2/preflight.sh"
      - "tools/p2/apply-host-patches.sh"
      - "third_party/quiche-0.29.3"
      - ".github/workflows/p2-m4-l03-policer.yml"
  workflow_dispatch:

jobs:
  l03:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout frozen host
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config perl nasm iproute2 iputils-ping iperf3 time

      - name: Apply P2 patches
        run: |
          bash tools/p2/preflight.sh
          bash tools/p2/apply-host-patches.sh

      - name: Verify fail-closed P2 evidence checkers
        run: python3 -m unittest tools/p2/replay/test_check_lite_trace.py tools/p2/replay/test_verify_g2_evidence.py

      - name: Build quiche applications
        run: |
          cargo build --manifest-path third_party/quiche-0.29.3/Cargo.toml -p tokio-quiche --example async_http3_server --features gcongestion
          cargo build --manifest-path third_party/quiche-0.29.3/Cargo.toml -p quiche_apps --bin quiche-client

      - name: Run L03 policer safety scenario
        env:
          # Target is byte/s inside BABR. 25,000,000 byte/s ~= 200 Mbps.
          BABR_P2_TARGET_BPS: "25000000"
          # Policer is explicit mbit/s for tc. 150 Mbps bottleneck.
          BABR_P2_POLICER_MBIT: "150"
          # The runner starts at 150 Mbps to obtain real Assist, then opens
          # TBF and injects a 150 Mbps dropping policer after that admission.
          BABR_P2_FLOW_BYTES: "268435456"
          BABR_P2_L03_ARTIFACT_DIR: ${{ github.workspace }}/阶段任务书/p2-l03-artifacts
        run: sudo -E bash tools/p2/netns/run-lite-l03-policer.sh

      - name: Upload L03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-l03-${{ github.sha }}
          path: 阶段任务书/p2-l03-artifacts
          if-no-files-found: error
